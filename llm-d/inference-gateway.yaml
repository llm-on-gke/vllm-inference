# Source: llm-d-modelservice/templates/decode-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-pd-llm-d-modelservice-decode
  labels:
    helm.sh/chart: llm-d-modelservice-v0.4.9
    app.kubernetes.io/version: "v0.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 50%
  selector:
    matchLabels:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/role: decode
      llm-d.ai/guide: "pd-disaggregation"
  template:
    metadata:
      labels:
        llm-d.ai/inference-serving: "true"
        llm-d.ai/role: decode
        llm-d.ai/guide: "pd-disaggregation"
      annotations:
        networking.gke.io/default-interface: eth0
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"default"},
            {"interfaceName":"eth2","network":"rdma-0"},
            {"interfaceName":"eth3","network":"rdma-1"},
            {"interfaceName":"eth4","network":"rdma-2"},
            {"interfaceName":"eth5","network":"rdma-3"},
            {"interfaceName":"eth6","network":"rdma-4"},
            {"interfaceName":"eth7","network":"rdma-5"},
            {"interfaceName":"eth8","network":"rdma-6"},
            {"interfaceName":"eth9","network":"rdma-7"}
          ]
    spec:
      initContainers:
        - name: routing-proxy
          args:
            - --port=8000
            - --vllm-port=8200
            - --connector=nixlv2
            - --zap-encoder=json
            - --zap-log-level=debug
            - --secure-proxy=false
          image: ghcr.io/llm-d/llm-d-routing-sidecar:latest
          imagePullPolicy: Always
          env:
          ports:
            - containerPort: 8000
          resources: {}
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
    
      serviceAccountName: ms-pd-llm-d-modelservice
      
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 250Gi
          name: shm
        - hostPath:
            path: /home/kubernetes/bin/nvidia
            type: ""
          name: library-dir-host
        - hostPath:
            path: /home/kubernetes/bin/gib
            type: ""
          name: gib
        - emptyDir: {}
          name: metrics-volume
        - emptyDir: {}
          name: torch-compile-cache
      
        - name: model-storage
          emptyDir: {}
        
      
      containers:
        - name: vllm
          image: ghcr.io/llm-d/llm-d-cuda:v0.5.1
          
          command:
            - /bin/bash
            - -c
          args:
            - |
              source /usr/local/gib/scripts/set_nccl_env.sh
              export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:${LD_LIBRARY_PATH}
              vllm serve Qwen/Qwen3-VL-235B-A22B-Instruct\
                --port 8200 \
                --served-model-name "Qwen/Qwen3-VL-235B-A22B-Instruct" \
                --tensor-parallel-size 8 \
                --block-size 128 \
                --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}' \
                --disable-log-requests \
                --disable-uvicorn-access-log \
                --max-model-len 32000
          env:
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: DP_SIZE
            value: "1"
          - name: TP_SIZE
            value: "8"
          - name: DP_SIZE_LOCAL
            value: "1"
          
          - name: HF_HOME
            value: /model-cache
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-d-hf-token
                key: HF_TOKEN
          
          ports:
          - containerPort: 8200
            name: vllm
            protocol: TCP
          resources:
            limits:
              cpu: "128"
              memory: 1Ti
              nvidia.com/gpu: "8"
            requests:
              cpu: "128"
              memory: 1Ti
              nvidia.com/gpu: "8"
          
          volumeMounts:
            - mountPath: /usr/local/nvidia
              name: library-dir-host
            - mountPath: /usr/local/gib
              name: gib
            - mountPath: /.config
              name: metrics-volume
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - name: model-storage
              mountPath: /model-cache
