apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaie-pd-epp
  namespace: default
  labels:
    app.kubernetes.io/name: gaie-pd-epp
    app.kubernetes.io/version: "v1.4.0"
    inference.networking.k8s.io/igw-mode: inferencepool
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      inferencepool: gaie-pd-epp
  template:
    metadata:
      labels:
        inferencepool: gaie-pd-epp
        inference.networking.k8s.io/igw-mode: inferencepool
    spec:
      serviceAccountName: gaie-pd-epp
      terminationGracePeriodSeconds: 130
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-inference-scheduler:v0.6.0
          imagePullPolicy: Always
          args:
              - --pool-name
              - gaie-pd
              - --pool-namespace
              - default
              - --pool-group
              - "inference.networking.x-k8s.io"
              - --zap-encoder
              - "json"
              - --config-file
              - "/config/pd-config.yaml"
              - --tracing=false
          resources:
            limits:
              memory: 32Gi
            requests:
              cpu: "8"
              memory: 16Gi
          ports:
            - name: grpc
              containerPort: 9002
            - name: grpc-health
              containerPort: 9003
            - name: metrics
              containerPort: 9090
          livenessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
              service: inference-extension
            periodSeconds: 2
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: plugins-config-volume
              mountPath: "/config"
      volumes:
        - name: plugins-config-volume
          configMap:
            name: gaie-pd-epp
